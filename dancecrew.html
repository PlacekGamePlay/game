<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box</title>
    <link rel="stylesheet" href="styles/dancecrew.css" />
</head>

<body>
    <div id="boxer">
        <img src="images/box.png" alt="box" id="box">
    </div>

    <audio id="song" src="audios/dancecrew.mp3"></audio>

    <script>
        const image = document.getElementById("box");
        const song = document.getElementById("song");

        const originalImage = "images/box.png";
        const changedImage = "images/box_open.png";
        const redirectURL = "strongererermonstererers.html";

        let isPlaying = false;

        image.addEventListener("click", () => {
            if (isPlaying) return;

            const chance = Math.random();

            if (chance < 0.8) {
                image.src = changedImage;
                song.play();
                isPlaying = true;

                song.addEventListener("ended", () => {
                    image.src = originalImage;
                    isPlaying = false;
                }, { once: true });

            } else {
                window.location.href = redirectURL;
            }
        });
    </script>

</body>

</html>
