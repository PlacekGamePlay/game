<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error</title>
    <link rel="icon" type="image/png" href="images/icon.png">
    <link rel="stylesheet" href="styles/styleError.css" />
</head>

<body>

    <a href=""><img id="feather" src="" alt=""> </a>


    <script>

        const featherImage = "images/peacock_placeholder.png"; 
        const pippinImage = "images/pippin.png";               

        const img = document.getElementById("feather");
        const chance = Math.random() * 100;

        if (chance < 95) {
            img.src = featherImage;
            img.alt = "feather";
        } else {
            img.src = pippinImage;
            img.alt = "pippin";
            img.style.position = "relative";
            img.style.top = "-50px";
        }

    </script>


</body>

</html>
