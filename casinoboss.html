<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEVEN DEADLY SINS</title>
    <link rel="stylesheet" href="styles/styleBoss.css" />
</head>

<body>

    <header>
        <p id="sins"> SEVEN DEADLY SINS </p>
    </header>

    <main>

        <p>
            The seven deadly sins
            <br>
            <span class="smaller">(also known as the capital vices or cardinal sins)</span>
            <br>
            function as a grouping of major vices within the teachings of <span class="yellow">Christianity</span>.
            <br>
            In the standard list, the seven deadly sins according to the <span class="yellow">Catholic Church</span> are
            <br>
            <span class="yellow">pride</span>, <span class="yellow">greed</span>,
            <span class="yellow">wrath</span>, <span class="yellow">lust</span>, <span class="yellow">gluttony</span>,
            and <span class="yellow">sloth</span>.
        </p>

    </main>
</body>

</html>
